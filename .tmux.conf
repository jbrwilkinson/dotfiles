# ~/.tmux.conf

#
# General
#
set -g default-terminal "tmux-256color"      # truecolor-capable terminal type
set -ga terminal-overrides ",*256col*:Tc"    # enable 24-bit colour passthrough
set -g history-limit 50000                   # generous scrollback
set -g display-time 2000                     # status messages linger 2s
set -sg escape-time 10                       # don't swallow ESC in vim
set -g focus-events on                       # let vim know when the pane refocuses
setw -g aggressive-resize on                 # resize to the smallest *attached* client

#
# Prefix: Ctrl-a (easier to reach than the default Ctrl-b)
#
unbind C-b
set -g prefix C-a
bind C-a send-prefix                          # press twice to send a literal Ctrl-a

#
# Mouse + sane indexing
#
set -g mouse on
set -g base-index 1                           # windows start at 1
setw -g pane-base-index 1                     # panes start at 1
set -g renumber-windows on                    # keep window numbers gapless

#
# Splits: keep the current path, and use intuitive | and - keys
#
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

#
# Vim-style pane navigation
#
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + Shift-HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

#
# Copy mode: use vi keys and select/yank like vim
#
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

#
# Reload config without restarting the server
#
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

#
# Status bar
#
set -g status-interval 5                      # refresh every 5s
set -g status-justify left
set -g status-style "fg=white,bg=default"
set -g status-left "#[fg=green,bold][#S] "    # session name
set -g status-left-length 20
set -g status-right "#[fg=cyan]#H #[fg=yellow]%Y-%m-%d %H:%M"
setw -g window-status-current-style "fg=black,bg=green,bold"
